spring.application.name=springboot-with-jpa-crud-repo
server.port=8082

# MySQL Connection Configuration
# --------------------------------------
# local sql
spring.datasource.url=jdbc:mysql://localhost:3306/spring_boot_users?serverTimezone=UTC

#docker
# spring.datasource.url=jdbc:mysql://host.docker.internal:3306/spring_boot_users?serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Properties
# 'update' automatically updates the schema structures on application startup
spring.jpa.hibernate.ddl-auto=update
# Logs the SQL statements
spring.jpa.show-sql=true

# Use a unique secret with at least 32 characters in each environment.
security.jwt.secret=change-this-development-secret-to-a-long-random-value
security.jwt.expiration=PT1H


#Logback 
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
